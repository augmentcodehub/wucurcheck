# 数据源：Cloudflare KV → Worker 传入的未签到账号列表（JSON）
# 触发方式：Worker「一键签到未签到」按钮 / Worker 定时任务
# 用途：签到 KV 数据库中今日未签到的账号（独立于 GitHub Secrets）
name: 批量签到未签到账号
on:
  workflow_dispatch:
    inputs:
      accounts_json:
        description: '账号列表 JSON'
        required: true
        type: string
      callback_url:
        description: '回调地址'
        required: false
        default: ''
        type: string

jobs:
  checkin:
    runs-on: ubuntu-latest
    environment: production
    steps:
    - uses: actions/checkout@v4

    - uses: actions/checkout@v4
      with:
        repository: ouraihub/pycore
        path: _pycore

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 安装依赖
      run: pip install -e _pycore/ -e .

    - name: 逐个签到
      run: |
        echo '${{ inputs.accounts_json }}' > accounts.json
        wucur checkin --file accounts.json --output results.json

    - name: 回调 Worker Dashboard
      if: always()
      env:
        CALLBACK_URL: ${{ inputs.callback_url || secrets.WORKER_CALLBACK_URL }}
        CALLBACK_SECRET: ${{ secrets.WORKER_CALLBACK_SECRET }}
      run: wucur callback --file results.json
